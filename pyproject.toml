[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reminder-scadenza-certificato"
version = "0.6.0"
description = "Reminder automatici per i certificati medici in scadenza"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
reminder-certificati = "reminder_certificati.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
