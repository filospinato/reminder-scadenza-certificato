[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reminder-scadenza-certificato"
version = "0.11.5"
description = "Reminder automatici per i certificati medici in scadenza"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]
google = [
  "google-api-python-client>=2.198,<3",
  "google-auth>=2.56,<3",
]

[project.scripts]
reminder-certificati = "reminder_certificati.cli:main"
reminder-certificati-runtime = "reminder_certificati.runtime_cli:main"
reminder-certificati-registry-check = "reminder_certificati.registry_probe_cli:main"
reminder-certificati-google-preflight = "reminder_certificati.google_preflight_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
