name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Schedule di sola verifica: gira ruff, compileall, pip check e pytest su
  # dati sintetici, senza environment, senza segreti e senza risorse live.
  # Non esegue né abilita i workflow produttivi vietati dalla §1.
  # Martedì e non lunedì, e non allo scoccare dell'ora: i cron più affollati
  # su GitHub vengono ritardati proprio quando la coda è piena.
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Sulle pull request i run superati da un push successivo vengono annullati:
  # pagare una macchina per validare codice gia sostituito e spreco puro.
  # Sui push a main il gruppo include lo SHA, quindi ogni commit ha il suo
  # gruppo e nessun run su main puo annullarne un altro. Un gruppo condiviso
  # con cancel-in-progress: false non basterebbe: GitHub tiene un solo run in
  # attesa per gruppo e annulla il precedente ancora in coda.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        # Su push e pull request gira solo la versione di produzione (3.12),
        # l'unica che i workflow eseguono davvero. La matrice di compatibilità
        # per le versioni stabili attualmente ammesse da `requires-python`
        # gira invece settimanalmente, o a richiesta prima di una release.
        python-version: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["3.11", "3.12", "3.13", "3.14"]') || fromJSON('["3.12"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev,google]"

      - name: Controlli statici
        run: |
          ruff check .
          python -m compileall -q src
          python -m pip check

      - name: Test
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pytest > pytest.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Carica log dei test falliti
        if: steps.test.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-failure-log-python-${{ matrix.python-version }}
          path: pytest.log
          retention-days: 3

      - name: Propaga il fallimento dei test
        if: steps.test.outcome == 'failure'
        run: |
          cat pytest.log
          exit 1
