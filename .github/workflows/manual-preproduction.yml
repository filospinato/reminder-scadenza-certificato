name: Pre-production manuale

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operazione sicura da eseguire
        required: true
        type: choice
        default: check-headers
        options:
          - check-headers
          - init-admin
          - dry-run
          - test-smtp
      today:
        description: Data simulata YYYY-MM-DD
        required: true
        default: "2026-07-17"
        type: string
      confirm_email_delivery:
        description: Conferma aggiuntiva per il solo test SMTP
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: reminder-certificati-preproduction
  cancel-in-progress: false

jobs:
  disabled:
    if: vars.PREPRODUCTION_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Environment non abilitato
        run: |
          echo "PREPRODUCTION_ENABLED non è true. Nessun accesso Google o SMTP eseguito."

  run:
    if: vars.PREPRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preproduction
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      OPERATIVO_SPREADSHEET_ID: ${{ vars.OPERATIVO_SPREADSHEET_ID }}
      OPERATIVO_SHEET_NAME: ${{ vars.OPERATIVO_SHEET_NAME }}
      OPERATIVO_HEADER_ROW: ${{ vars.OPERATIVO_HEADER_ROW }}
      OPERATIVO_COLUMNS_A1: ${{ vars.OPERATIVO_COLUMNS_A1 }}
      ADMIN_SPREADSHEET_ID: ${{ vars.ADMIN_SPREADSHEET_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticazione Google temporanea
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[google]"

      - name: Controlla intestazioni
        if: inputs.operation == 'check-headers'
        run: reminder-certificati-runtime check-headers

      - name: Inizializza o verifica il foglio amministrativo
        if: inputs.operation == 'init-admin'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ADMIN_SPREADSHEET_ID:-}" ]]; then
            reminder-certificati-runtime init-admin --spreadsheet-id "$ADMIN_SPREADSHEET_ID"
          else
            reminder-certificati-runtime init-admin
          fi

      - name: Esegui dry-run aggregato
        if: inputs.operation == 'dry-run'
        run: reminder-certificati-runtime run --mode DRY_RUN --today "${{ inputs.today }}"

      - name: Esegui test SMTP all'override
        if: inputs.operation == 'test-smtp' && inputs.confirm_email_delivery
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_FROM_NAME: ${{ vars.SMTP_FROM_NAME }}
          SMTP_REPLY_TO: ${{ vars.SMTP_REPLY_TO }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALLOW_EMAIL_DELIVERY: "true"
        run: reminder-certificati-runtime run --mode TEST_SMTP --today "${{ inputs.today }}" --confirm-email-delivery

      - name: Rifiuta test SMTP senza conferma
        if: inputs.operation == 'test-smtp' && !inputs.confirm_email_delivery
        run: |
          echo "Conferma email non fornita" >&2
          exit 2
