name: Pre-production manuale

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operazione sicura da eseguire
        required: true
        type: choice
        default: google-preflight
        options:
          - google-preflight
          - check-headers
          - init-admin
          - registry-check
          - dry-run
          - test-smtp
      today:
        description: Data simulata YYYY-MM-DD; lascia vuoto per usare la data corrente
        required: false
        default: ""
        type: string
      confirm_synthetic_registry_write:
        description: Conferma aggiuntiva per la sola scrittura sintetica nel registro
        required: true
        default: false
        type: boolean
      confirm_email_delivery:
        description: Conferma aggiuntiva per il solo test SMTP
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: reminder-certificati-runtime
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preproduction
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      OPERATIVO_SPREADSHEET_ID: ${{ vars.OPERATIVO_SPREADSHEET_ID }}
      OPERATIVO_SHEET_NAME: ${{ vars.OPERATIVO_SHEET_NAME }}
      OPERATIVO_HEADER_ROW: ${{ vars.OPERATIVO_HEADER_ROW }}
      OPERATIVO_COLUMNS_A1: ${{ vars.OPERATIVO_COLUMNS_A1 }}
      ADMIN_SPREADSHEET_ID: ${{ vars.ADMIN_SPREADSHEET_ID }}
    steps:
      - name: Verifica abilitazione environment
        id: gate
        shell: bash
        env:
          PREPRODUCTION_ENABLED: ${{ vars.PREPRODUCTION_ENABLED }}
        run: |
          set -euo pipefail
          if [[ "${PREPRODUCTION_ENABLED:-}" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "PREPRODUCTION_ENABLED non è true. Nessun accesso Google o SMTP sarà eseguito."
          fi

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Autenticazione Google temporanea
        if: steps.gate.outputs.enabled == 'true'
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up Python
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.gate.outputs.enabled == 'true'
        run: python -m pip install --upgrade pip && pip install -e ".[google]"

      - name: Esegui preflight Google in sola lettura
        if: steps.gate.outputs.enabled == 'true' && inputs.operation == 'google-preflight'
        run: reminder-certificati-google-preflight

      - name: Controlla intestazioni
        if: steps.gate.outputs.enabled == 'true' && inputs.operation == 'check-headers'
        run: reminder-certificati-runtime check-headers

      - name: Inizializza o verifica il foglio amministrativo
        if: steps.gate.outputs.enabled == 'true' && inputs.operation == 'init-admin'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ADMIN_SPREADSHEET_ID:-}" ]]; then
            echo "ADMIN_SPREADSHEET_ID mancante: crea e condividi prima uno Spreadsheet vuoto." >&2
            exit 2
          fi
          reminder-certificati-runtime init-admin --spreadsheet-id "$ADMIN_SPREADSHEET_ID"

      - name: Collauda il registro con una riga sintetica
        if: steps.gate.outputs.enabled == 'true' && inputs.operation == 'registry-check' && inputs.confirm_synthetic_registry_write
        env:
          ALLOW_SYNTHETIC_REGISTRY_WRITE: "true"
        run: reminder-certificati-registry-check --confirm-synthetic-write

      - name: Rifiuta collaudo registro senza conferma
        if: steps.gate.outputs.enabled == 'true' && inputs.operation == 'registry-check' && !inputs.confirm_synthetic_registry_write
        run: |
          echo "Conferma della scrittura sintetica non fornita" >&2
          exit 2

      - name: Esegui dry-run aggregato
        if: steps.gate.outputs.enabled == 'true' && inputs.operation == 'dry-run'
        shell: bash
        env:
          INPUT_TODAY: ${{ inputs.today }}
        run: |
          set -euo pipefail
          args=(run --mode DRY_RUN)
          if [[ -n "${INPUT_TODAY:-}" ]]; then
            args+=(--today "$INPUT_TODAY")
          fi
          reminder-certificati-runtime "${args[@]}"

      - name: Esegui test SMTP all'override
        if: steps.gate.outputs.enabled == 'true' && inputs.operation == 'test-smtp' && inputs.confirm_email_delivery
        shell: bash
        env:
          INPUT_TODAY: ${{ inputs.today }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_FROM_NAME: ${{ vars.SMTP_FROM_NAME }}
          SMTP_REPLY_TO: ${{ vars.SMTP_REPLY_TO }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALLOW_EMAIL_DELIVERY: "true"
        run: |
          set -euo pipefail
          args=(run --mode TEST_SMTP --confirm-email-delivery)
          if [[ -n "${INPUT_TODAY:-}" ]]; then
            args+=(--today "$INPUT_TODAY")
          fi
          reminder-certificati-runtime "${args[@]}"

      - name: Rifiuta test SMTP senza conferma
        if: steps.gate.outputs.enabled == 'true' && inputs.operation == 'test-smtp' && !inputs.confirm_email_delivery
        run: |
          echo "Conferma email non fornita" >&2
          exit 2
