name: Reminder certificati — uso ordinario

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operazione da eseguire
        required: true
        type: choice
        default: check
        options:
          - check
          - test-smtp

permissions:
  contents: read
  id-token: write

concurrency:
  group: reminder-certificati-runtime
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preproduction
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      OPERATIVO_SPREADSHEET_ID: ${{ vars.OPERATIVO_SPREADSHEET_ID }}
      OPERATIVO_SHEET_NAME: ${{ vars.OPERATIVO_SHEET_NAME }}
      OPERATIVO_HEADER_ROW: ${{ vars.OPERATIVO_HEADER_ROW }}
      OPERATIVO_COLUMNS_A1: ${{ vars.OPERATIVO_COLUMNS_A1 }}
      ADMIN_SPREADSHEET_ID: ${{ vars.ADMIN_SPREADSHEET_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticazione Google temporanea
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[google]"

      - name: Controlla senza inviare
        if: inputs.operation == 'check'
        run: reminder-certificati check

      - name: Invia una email di prova all'override
        if: inputs.operation == 'test-smtp'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_REPLY_TO: ${{ vars.SMTP_REPLY_TO }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: reminder-certificati test-smtp
