name: Reminder certificati — invii reali

on:
  workflow_dispatch:
    inputs:
      max_sends:
        description: Numero massimo di invii reali in questa esecuzione
        required: true
        type: choice
        default: "1"
        options:
          - "1"
          - "5"
          - "10"

permissions:
  contents: read
  id-token: write

concurrency:
  group: reminder-certificati-runtime
  cancel-in-progress: false

jobs:
  reminder:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preproduction
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      OPERATIVO_SPREADSHEET_ID: ${{ vars.OPERATIVO_SPREADSHEET_ID }}
      ADMIN_SPREADSHEET_ID: ${{ vars.ADMIN_SPREADSHEET_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Autenticazione Google temporanea
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[google]"

      - name: Esecuzione produzione
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURITY: ${{ vars.SMTP_SECURITY }}
          ALLOW_PLAIN_SMTP: ${{ vars.ALLOW_PLAIN_SMTP }}
          SMTP_FROM: ${{ vars.SMTP_USERNAME }}
          SMTP_REPLY_TO: ${{ vars.SMTP_REPLY_TO }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: reminder-certificati produzione --max-sends "${{ inputs.max_sends }}"

# Gli invii richiedono INVIO_AUTOMATICO_ATTIVO=true nella CONFIG.
# Nessuna schedule è attiva. Aggiungerne una sola esclusivamente dopo il
# completamento dei lotti controllati e l'autorizzazione finale al go-live.
